name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check for unused dependencies
        run: |
          npm ls --all 2>&1 || true
          echo "---"
          echo "Dependencies: $(node -e "console.log(Object.keys(require('./package.json').dependencies).join(', '))")"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/cli.js || { echo "Missing dist/cli.js"; exit 1; }
          test -f dist/index.js || { echo "Missing dist/index.js"; exit 1; }
          echo "dist/ contents:"
          ls -la dist/
          echo "---"
          echo "Total dist size:"
          du -sh dist/
